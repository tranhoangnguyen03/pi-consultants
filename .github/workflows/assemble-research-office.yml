name: assemble Research Scientist E (temporary)
on:
  push:
    branches: [feat/research-scientist-e]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vendor pinned upstream research skills
        run: node firm/scripts/vendor-research.mjs
      - name: Generate all HQs from the factory
        run: npm run setup -- --rebuild --yes
      - name: Run repository verification
        run: npm run verify
      - name: Commit vendored skills and generated E office
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firm/skills/research offices/research-consultant
          git diff --cached --quiet && exit 0
          git commit -m "Build Research Scientist E HQ with pinned local skills"
          git push origin HEAD:feat/research-scientist-e
